name: Quality

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/supabase-keep-alive.yml'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/workflows/supabase-keep-alive.yml'
      - '**.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run check
      - run: npm --prefix functions run check
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm --prefix functions audit --omit=dev --audit-level=critical
